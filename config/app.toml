[app]
name = "DesktopAI"
version = "2.0.0"
theme = "dark"
first_run = true

[ai]
model = "llama3.2"
model_fast = "llama3.2:1b"
host = "http://localhost:11434"
timeout = 60
max_retries = 3

[scanner]
max_depth = 10
max_workers = 4
skip_hidden = true
skip_system = true

[ocr]
enabled = true
engine = "tesseract"
languages = [ "eng",]

[search]
max_results = 50
min_score = 0.3
embedding_model = "all-MiniLM-L6-v2"

[storage]
db_filename = "desktop_ai.db"

[logging]
level = "WARNING"
max_mb = 5
backup_count = 3

[window]
width = 1280
height = 800
remember_geometry = true
